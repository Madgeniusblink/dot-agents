name: acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # budget.raised and proof.dropped compare with the PR base, so the job
      # needs that commit and the history since it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutrality (context strings)
        if: runner.os != 'Windows' && github.repository == 'Madgeniusblink/dot-agents'
        shell: bash
        run: sh scripts/check-neutrality.sh context

      - name: Neutrality (vendor names)
        if: runner.os != 'Windows' && github.repository == 'Madgeniusblink/dot-agents'
        shell: bash
        run: sh scripts/check-neutrality.sh vendors

      - name: upstream.json paths exist
        shell: bash
        run: |
          test -f home/standards/README.md
          test -f home/standards/adopt.md
          test -f home/context/data-locations.md
          test -f home/context/upstream.json

      - name: Relative link check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 home/scripts/check-links.py
          python3 home/scripts/check-links.py .

      - name: CLI (fmt, clippy, tests, parity with the scripts)
        continue-on-error: true
        if: github.repository == 'Madgeniusblink/dot-agents'
        working-directory: cli
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # agents check owns every budget, so a fork runs it too, without the
      # template rules that a fork's own home may break by design.
      - name: agents check
        working-directory: cli
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=
          if [ "$GITHUB_REPOSITORY" = Madgeniusblink/dot-agents ]; then
            args=--template
          fi
          if [ -n "$BASE_SHA" ]; then
            args="$args --base $BASE_SHA"
          fi
          cargo run --quiet -- --home ../home check $args


