name: acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Neutrality (context strings)
        if: runner.os != 'Windows' && github.repository == 'Madgeniusblink/dot-agents'
        shell: bash
        run: sh scripts/check-neutrality.sh context

      - name: Neutrality (vendor names)
        if: runner.os != 'Windows' && github.repository == 'Madgeniusblink/dot-agents'
        shell: bash
        run: sh scripts/check-neutrality.sh vendors

      - name: upstream.json paths exist
        shell: bash
        run: |
          test -f standards/README.md
          test -f standards/adopt.md
          test -f context/data-locations.md
          test -f context/upstream.json

      - name: Context budget
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/check-budget.sh

      - name: Relative link check
        if: runner.os != 'Windows'
        run: python3 scripts/check-links.py

      - name: CLI (fmt, clippy, tests, parity with the scripts)
        if: github.repository == 'Madgeniusblink/dot-agents'
        working-directory: cli
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: agents check on the template
        if: github.repository == 'Madgeniusblink/dot-agents'
        working-directory: cli
        shell: bash
        run: cargo run --quiet -- --home .. check --template


