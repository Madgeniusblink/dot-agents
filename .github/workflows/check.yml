name: acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Neutrality (context strings)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/check-neutrality.sh context

      - name: Neutrality (vendor names)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/check-neutrality.sh vendors

      - name: upstream.json paths exist
        shell: bash
        run: |
          test -f .agents/standards/README.md
          test -f .agents/standards/install.md
          test -f .agents/context/data-locations.md
          test -f .agents/context/upstream.json
          test -f .agents/.user-owned
          test -f .agents/.managed-refresh

      - name: Relative link check
        if: runner.os != 'Windows'
        run: python3 scripts/check-links.py

      - name: Install behavior (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/test-install-behavior.sh

      - name: Install unknown flag fails (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ./install.sh --forse; then exit 1; fi

      - name: Install behavior (ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $agentHome = Join-Path $env:RUNNER_TEMP "agents-home"
          $env:DOT_AGENTS_HOME = $agentHome
          ./install.ps1
          Add-Content -Path (Join-Path $agentHome "memory/lessons.md") -Value "USER LESSON"
          ./install.ps1
          if (-not (Select-String -Path (Join-Path $agentHome "memory/lessons.md") -Pattern "USER LESSON" -Quiet)) {
            throw "memory/lessons.md was overwritten"
          }
          Set-Content -Path (Join-Path $agentHome "AGENTS.md") -Value "MY AGENT RULES"
          ./install.ps1
          if (-not (Select-String -Path (Join-Path $agentHome "AGENTS.md") -Pattern "MY AGENT RULES" -Quiet)) {
            throw "AGENTS.md was overwritten"
          }
          Set-Content -Path (Join-Path $agentHome "standards/README.md") -Value "STALE"
          ./install.ps1
          if (-not (Select-String -Path (Join-Path $agentHome "standards/README.md") -Pattern "Public contract" -Quiet)) {
            throw "standards/ was not refreshed"
          }
