[package]
name = "dot-agents"
version = "0.3.0"
edition = "2021"
description = "Install and verify the ~/.agents global template (embedded, no repo required)"
license = "MIT"
repository = "https://github.com/Madgeniusblink/dot-agents"
readme = "README.md"

[[bin]]
name = "dot-agents"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
