[package]
name = "dot-agents"
version = "0.15.0"
edition = "2021"
description = "Point every agent tool on a machine at one ~/.agents home"
license = "MIT"
repository = "https://github.com/Madgeniusblink/dot-agents"
readme = "README.md"
keywords = ["agents", "claude", "codex", "cursor", "context"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agents"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
