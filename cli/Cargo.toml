[package]
name = "dot-agents"
version = "0.1.0"
edition = "2021"
description = "Install and verify the ~/.agents global template from dot-agents"
license = "MIT"

[[bin]]
name = "dot-agents"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
walkdir = "2"
