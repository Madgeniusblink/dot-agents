[package]
name = "dot-agents"
version = "0.17.0"
edition = "2021"
description = "Point every agent tool on a machine at one ~/.agents home"
license = "MIT"
repository = "https://github.com/Madgeniusblink/dot-agents"
homepage = "https://github.com/Madgeniusblink/dot-agents"
readme = "../README.md"
keywords = ["agents", "claude", "codex", "cursor", "context"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agents"
path = "src/main.rs"

[dependencies]
anyhow = "1"
basic-toml = "0.1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
walkdir = "2"

# Raw mode for `agents ui`. Already in the tree through terminal_size, so no
# crate is added (decision 0011).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
# The formula carries the binary's name: brew install madgeniusblink/tap/agents
formula = "agents"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
